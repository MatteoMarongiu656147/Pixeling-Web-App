<!-- Provides a self-contained page for failed offline navigations. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light" />
    <title>Offline | Pixeling</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #282621;
        background: #fbfaf8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
      }

      main {
        width: min(100%, 28rem);
        padding: clamp(1.75rem, 7vw, 3rem);
        border: 1px solid #e9e5df;
        border-radius: 1.25rem;
        background: white;
        text-align: center;
        box-shadow: 0 12px 36px rgb(35 31 25 / 8%);
      }

      .offline-illustration {
        display: block;
        width: clamp(7rem, 30vw, 10rem);
        height: auto;
        margin: 0 auto 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 6vw, 2.25rem);
        letter-spacing: -0.04em;
      }

      p {
        margin: 0.9rem 0 1.75rem;
        color: #5f5b55;
        line-height: 1.6;
      }

      button {
        min-height: 2.75rem;
        padding: 0.7rem 1.1rem;
        border: 1px solid #d96f12;
        border-radius: 0.7rem;
        background: #f28c28;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #e97c18;
      }

      button:focus-visible {
        outline: 3px solid rgb(242 140 40 / 40%);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: no-preference) {
        button {
          transition: background-color 160ms ease;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <img
        class="offline-illustration"
        src="/NoConnection.png"
        alt=""
        aria-hidden="true"
        width="320"
        height="320"
      />
      <h1 id="offline-title">You’re offline</h1>
      <p role="status">
        Pixeling can’t reach the Internet right now. Check your connection and
        try again.
      </p>
      <form action="/" method="get">
        <button type="submit">Try again</button>
      </form>
    </main>
  </body>
</html>
